name: webshop-cms

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/var/www/html
    environment:
      APP_URL: ${APP_URL:-https://webshop.test}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: webshop
      DB_USERNAME: user
      DB_PASSWORD: password
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_ENCRYPTION: "null"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - webshop-network

  nginx:
    image: nginx:stable
    depends_on:
      - php
    ports:
      - "127.0.0.1:8081:80"
      - "127.0.0.1:443:443"
    volumes:
      - ..:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - webshop-network

  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3322:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: webshop
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - webshop-network

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"
    networks:
      - webshop-network

  node:
    image: node:24
    ports:
      - "127.0.0.1:5174:5174"
    volumes:
      - ..:/var/www/html
      - node_modules:/var/www/html/node_modules
    working_dir: /var/www/html
    environment:
      APP_URL: ${APP_URL:-https://webshop.test}
    command: ["tail", "-f", "/dev/null"]
    networks:
      - webshop-network

volumes:
  mysql_data:
  node_modules:

networks:
  webshop-network:
