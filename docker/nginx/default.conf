server {
    listen 80;
    listen 443 ssl;
    server_name webshop.test localhost;
    ssl_certificate /etc/nginx/certs/webshop.test.pem;
    ssl_certificate_key /etc/nginx/certs/webshop.test-key.pem;
    root /var/www/html/public;
    index index.php;

    location = / {
        return 302 /login;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 2G;
}
